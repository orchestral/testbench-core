name: parallel-tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: "ubuntu-latest"
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      matrix:
        php:
          - 8.1
          - 8.2
          - 8.3
        dependencies:
          - "highest"
          - "lowest"
        experimental:
          - false
        exclude:
          - php: 8.3
            dependencies: "lowest"

    name: PHP:${{ matrix.php }} / Paratest:^6.4 ${{ matrix.dependencies == 'highest' && '⬆️' || '⬇️' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, mysql, mysqli, pdo_mysql, bcmath, intl, fileinfo, :php-psr
          coverage: none

      - name: Install PHPUnit ^9.5.10
        run: |
          composer require "phpunit/phpunit:^9.5.10" --no-interaction --no-update
          composer require "nunomaduro/collision:^6.2" "brianium/paratest:^6.4" --dev --no-interaction --no-update

      - name: Install dependencies
        uses: "ramsey/composer-install@v3"
        with:
          dependency-versions: "${{ matrix.dependencies }}"
          composer-options: "--prefer-dist --no-cache"

      - name: Installed dependencies
        run: |
          composer show -D

      - name: Execute tests (with deprecations)
        run: ./testbench package:test --parallel --exclude-group without-parallel,commander,database,session
        if: matrix.dependencies == 'highest'

      - name: Execute tests (without deprecations)
        run: ./testbench package:test --parallel --exclude-group without-parallel,commander,database,session,deprecations
        env:
          TESTBENCH_CONVERT_DEPRECATIONS_TO_EXCEPTIONS: false
        if: matrix.dependencies != 'highest'
