name: parallel-tests

on:
  push:
    branches:
      - '*.x'
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: "ubuntu-latest"
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      matrix:
        php:
          - 8.2
          - 8.3
          - 8.4
        collision:
          - "^8.0"
        paratest:
          - "^7.3"
        phpunit:
          - "~10.5.35"
          - "~11.3.6"
          - "~11.4.0"
          - "~11.5.0"
          - "~12.0.0"
          - "~12.1.0"
          - "~12.2.0"
          - "~12.3.0"
        experimental:
          - false
        exclude:
          - php: 8.4
            phpunit: "~10.5.35"
          - php: 8.4
            phpunit: "~11.3.6"
          - php: 8.2
            phpunit: "~12.0.0"
          - php: 8.2
            phpunit: "~12.1.0"
          - php: 8.2
            phpunit: "~12.2.0"
          - php: 8.2
            phpunit: "~12.3.0"

    name: PHP:${{ matrix.php }} / Paratest:${{ matrix.paratest }} / PHPUnit:${{ matrix.phpunit }} ⬆️

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, mysql, mysqli, pdo_mysql, bcmath, intl, fileinfo, :php-psr
          coverage: none

      - name: Install Paratest
        run: |
          composer require "nunomaduro/collision:${{ matrix.collision }}" "brianium/paratest:${{ matrix.paratest }}" --dev --no-interaction --no-update

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: "highest"
          composer-options: "--prefer-dist --no-cache --with=phpunit/phpunit:${{ matrix.phpunit }}"

      - name: Installed dependencies
        run: |
          composer show -D

      - name: Execute tests
